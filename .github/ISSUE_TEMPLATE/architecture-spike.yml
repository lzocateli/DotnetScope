name: Spike ou decisão arquitetural
description: Registre uma investigação ou decisão que pode exigir ADR
title: "[Spike]: "
labels: ["question", "type:spike", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Intake apenas: esta Issue não autoriza experimento ou implementação. Aguarde escopo revisado e autorização explícita do mantenedor. A investigação apoia uma decisão do plano em docs/plano-implementacao.md; apresente alternativas, evidências e limites. ADR auxiliar permanece proposed até decisão humana."
  - type: textarea
    id: question
    attributes:
      label: Pergunta ou decisão a esclarecer
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto, alternativas e restrições
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidência esperada
      description: Informe experimento, documento, métrica ou protótipo necessário.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risco arquitetural
      options: [baixo, médio, alto]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Áreas envolvidas
      multiple: true
      options: [CLI, Resolução de versões, Instalação, Ambiente e PATH, Linux, Windows, macOS, Segurança, Empacotamento, CI/CD, Documentação, Testes]
    validations:
      required: true
  - type: checkboxes
    id: governance
    attributes:
      label: Governança
      options:
        - label: Avaliei se a conclusão exige ADR antes da implementação.
          required: true
