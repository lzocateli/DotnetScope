# Gerenciado pelo Altivy.Groundwork (componente ci). Não edite: mudanças vão para o catálogo.
name: Gitleaks

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  full-history:
    name: Full History
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test secret scanning rules
        if: ${{ hashFiles('tools/scripts/test-gitleaks.ps1') != '' }}
        shell: pwsh
        run: ./tools/scripts/test-gitleaks.ps1

      # Um arquivo por commit (mensagem e patch), varrido em modo dir. Pelo stdin, o gitleaks corta a
      # entrada em blocos cujos limites dependem do tamanho do histórico inteiro: uma linha cortada
      # escapa das allowlists ancoradas e o achado aparece ou some a cada novo commit.
      - name: Scan full Git history
        shell: bash
        run: |
          set -euo pipefail
          patches=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          git log --all --full-history -p -- |
            awk -v dir="$patches" '/^commit [0-9a-f]+$/ { if (file) close(file); file = dir "/" $2 ".patch" } file { print > file }'
          chmod -R a+rX "$patches"
          echo "$(find "$patches" -type f | wc -l) commits preparados para a varredura."
          config_args=()
          scan_args=(dir /history --redact)
          if [[ -f .gitleaks.toml ]]; then
            config_args=(--volume "$GITHUB_WORKSPACE/.gitleaks.toml:/gitleaks.toml:ro")
            scan_args+=(--config /gitleaks.toml)
          fi
          docker run --rm --read-only --volume "$patches:/history:ro" "${config_args[@]}" \
            docker.io/lzocateli/gitleaks:8.30.1 \
            "${scan_args[@]}"
