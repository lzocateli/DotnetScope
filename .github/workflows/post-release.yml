# Semente do Altivy.Groundwork (componente release): distribuicao do DotnetScope.
# Chamado por gw-release.yml depois que a GitHub Release foi publicada (assets publicos).
# - homebrew: no Environment `release` (unico lugar do HOMEBREW_TAP_TOKEN), gera a formula a
#   partir do SHA256SUMS publicado e envia ao tap; idempotente (formula igual nao gera commit).
# - verify-homebrew: instala pelo tap e confere a versao.
# - winget: winget.yml valida e submete no Environment `winget`; nao submete se a versao ja
#   estiver no winget-pkgs ou houver PR aberto.
name: Post release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag da release publicada (vX.Y.Z)
        type: string
        required: true
      version:
        description: Versao da release (X.Y.Z)
        type: string
        required: true
      republish:
        description: Execucao do modo republish de uma release existente
        type: boolean
        default: false

permissions: {}

jobs:
  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    outputs:
      formula: ${{ steps.tap.outputs.formula }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Download published checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist

      - name: Update Homebrew tap
        id: tap
        shell: pwsh
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          ./tools/scripts/Update-HomebrewTap.ps1 -Version $env:VERSION -ReleaseDirectory dist -Push
          $code = $LASTEXITCODE
          if ($code -eq 3) {
            Write-Output "::warning::Tap Homebrew ja publica versao maior que $($env:VERSION); formula mantida."
            "formula=newer" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($code -eq 0) { "formula=current" >> $env:GITHUB_OUTPUT }
          exit $code

  verify-homebrew:
    name: Verify Homebrew tap
    needs: homebrew
    if: ${{ needs.homebrew.outputs.formula == 'current' }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Install from tap
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail
          brew install lzocateli/tap/dotnetscope
          actual="$(dotnetscope --version)"
          case "$actual" in
            "$VERSION"|"$VERSION"+*) echo "ok: $actual" ;;
            *) echo "::error::Versao instalada pelo tap '$actual' difere de $VERSION."; exit 1 ;;
          esac
          brew test lzocateli/tap/dotnetscope

  winget:
    name: Winget
    permissions:
      contents: read
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ inputs.tag }}
      submit: true
    # Em reutilizáveis aninhados (gw-release -> post-release -> winget), cada chamada precisa repassar
    # os secrets; sem isso, o WINGET_CREATE_GITHUB_TOKEN do Environment winget chega vazio ao job.
    secrets: inherit
