name: Scheduled Smoke

# Valida o binário AOT contra o metadata e os artefatos oficiais reais, detectando mudanças
# de esquema ou de layout que as fixtures sintéticas dos testes não capturam.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Official metadata (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Native AOT binary
        shell: pwsh
        run: ./tools/scripts/Invoke-Validation.ps1 -Aot -Engine docker

      - name: Query official metadata
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          set -euo pipefail
          bin=./artifacts/aot/linux-x64/dotnetscope
          "$bin" list --available --verbose
          "$bin" list --available lts
          "$bin" list --available sts --prerelease
          "$bin" list --available SDK-10.0.1xx
          for component in sdk runtime aspnetcore; do
            "$bin" list --available lts -c "$component" --output json |
              jq -e '.resolved.sha512 | test("^[0-9a-f]{128}$")'
          done
          "$bin" list --available lts --offline > /dev/null

  install-e2e:
    name: Install E2E (user scope, clean containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Native AOT binary
        shell: pwsh
        run: ./tools/scripts/Invoke-Validation.ps1 -Aot -Engine docker

      - name: Install SDK and runtime in clean containers
        shell: pwsh
        run: ./tools/scripts/Invoke-E2E.ps1 -Engine docker

  install-e2e-windows:
    name: Install E2E (Windows user scope, ephemeral runner)
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build Native AOT binary
        shell: pwsh
        run: ./tools/scripts/Invoke-Validation.ps1 -Native -Aot

      - name: Install SDK and runtime, verify registry and revert
        shell: pwsh
        run: ./tools/scripts/Invoke-WindowsE2E.ps1
